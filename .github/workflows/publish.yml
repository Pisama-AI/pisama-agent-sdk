name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Verify release commit belongs to main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag_version=$TAG_VERSION pyproject=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag declares v$TAG_VERSION but pyproject.toml is $PKG_VERSION"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify the exact artifact set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        artifact: [wheel, sdist]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Select exact ${{ matrix.artifact }} artifact
        id: package
        shell: bash
        run: |
          shopt -s nullglob
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            packages=(dist/*.whl)
          else
            packages=(dist/*.tar.gz)
          fi
          test "${#packages[@]}" -eq 1
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"
      - name: Install exact ${{ matrix.artifact }} artifact
        run: python -m pip install --quiet "${{ steps.package.outputs.path }}"
      - name: Smoke test installed artifact
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" python - <<'PY'
          import os
          from importlib.metadata import version

          import pisama_agent_sdk
          from pisama_agent_sdk.atif import AtifAnalyzeResult, SUPPORTED_SCHEMA_VERSIONS

          assert version("pisama-agent-sdk") == os.environ["EXPECTED_VERSION"]
          assert pisama_agent_sdk.__version__ == os.environ["EXPECTED_VERSION"]
          assert "ATIF-v1.7" in SUPPORTED_SCHEMA_VERSIONS
          result = AtifAnalyzeResult.from_response({
              "trace": {
                  "trace_id": "release-smoke",
                  "span_count": 1,
                  "total_tokens": 3,
                  "atif_schema_version": "ATIF-v1.7",
                  "topology_complete": True,
              },
              "diagnosis": {
                  "detection_status": "complete",
                  "detectors_failed": {},
                  "all_detections": [],
              },
          })
          assert result.analysis_complete
          print(f"smoke OK: pisama-agent-sdk {pisama_agent_sdk.__version__}")
          PY
      - name: Smoke test installed CLI
        run: pisama-openhands-monitor --help

  claude-contract:
    name: Native Claude Agent SDK artifact contract
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Install wheel with native integration
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install --quiet "${wheels[0]}[claude,evaluator]"
      - name: Construct real Claude SDK options
        run: |
          python - <<'PY'
          from claude_agent_sdk import ClaudeAgentOptions
          from pisama_agent_sdk import (
              create_claude_check_server,
              create_claude_hooks,
          )

          ClaudeAgentOptions(hooks=create_claude_hooks())
          ClaudeAgentOptions(
              mcp_servers={"pisama": create_claude_check_server()},
              allowed_tools=["mcp__pisama__pisama_check"],
          )
          PY

  publish:
    needs: [build, smoke, claude-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  registry-smoke:
    name: Verify public PyPI artifact (${{ matrix.python-version }})
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the exact public version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for attempt in {1..12}; do
            if python -m pip install \
              --disable-pip-version-check \
              --no-cache-dir \
              "pisama-agent-sdk[claude,evaluator]==$expected"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Verify public metadata and native integrations
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" python - <<'PY'
          import os
          from importlib.metadata import version

          from claude_agent_sdk import ClaudeAgentOptions
          import pisama_agent_sdk

          expected = os.environ["EXPECTED_VERSION"]
          assert version("pisama-agent-sdk") == expected
          assert pisama_agent_sdk.__version__ == expected
          ClaudeAgentOptions(hooks=pisama_agent_sdk.create_claude_hooks())
          ClaudeAgentOptions(
              mcp_servers={
                  "pisama": pisama_agent_sdk.create_claude_check_server()
              }
          )
          PY
          pisama-openhands-monitor --help
