name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/pisama_agent_sdk

      - name: Test
        run: pytest tests/ -q --tb=short --cov=pisama_agent_sdk --cov-report=term --cov-fail-under=70

  minimum-core:
    name: Minimum pisama-core contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install the declared dependency floor
        run: |
          python -m pip install \
            -e ".[dev,telemetry,verification]" \
            "pisama-core==1.7.3"
          python -m pip check
      - name: Type-check installed optional integrations
        run: mypy src/pisama_agent_sdk
      - name: Run the complete suite at the dependency floor
        run: pytest tests/ -q --tb=short

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify the exact artifact set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
      - name: Test the built wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          index=0
          for artifact in dist/*.whl dist/*.tar.gz; do
            smoke_env="$RUNNER_TEMP/artifact-smoke-$index"
            python -m venv "$smoke_env"
            "$smoke_env/bin/python" -m pip install --quiet \
              "${artifact}[claude,evaluator]"
            "$smoke_env/bin/python" - <<'PY'
          from importlib.metadata import metadata, version

          from claude_agent_sdk import ClaudeAgentOptions
          import pisama_agent_sdk
          from pisama_agent_sdk.atif import SUPPORTED_SCHEMA_VERSIONS

          assert version("pisama-agent-sdk") == pisama_agent_sdk.__version__
          assert pisama_agent_sdk.__version__ == "0.2.2"
          assert "ATIF-v1.7" in SUPPORTED_SCHEMA_VERSIONS

          hooks = pisama_agent_sdk.create_claude_hooks()
          ClaudeAgentOptions(hooks=hooks)
          server = pisama_agent_sdk.create_claude_check_server()
          ClaudeAgentOptions(mcp_servers={"pisama": server})

          project_urls = metadata("pisama-agent-sdk").get_all("Project-URL") or []
          assert any(
              value.endswith(
                  "Repository, https://github.com/Pisama-AI/pisama-agent-sdk"
              )
              for value in project_urls
          )
          PY
            "$smoke_env/bin/pisama-openhands-monitor" --help >/dev/null
            index=$((index + 1))
          done
